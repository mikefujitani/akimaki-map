<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>秋まき植物育成試験 観察マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Hiragino Sans', 'Meiryo', sans-serif; }
  #header {
    background: #2d6a2d;
    color: white;
    padding: 10px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #header h1 { font-size: 1rem; }
  #header .updated { font-size: 0.75rem; opacity: 0.8; }
  #map { height: calc(100vh - 44px); width: 100%; }
  .custom-marker {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px solid rgba(0,0,0,0.3);
    font-size: 18px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  .popup-photo {
    width: 100%;
    max-width: 220px;
    border-radius: 6px;
    margin-bottom: 6px;
    cursor: pointer;
  }
  .popup-content { font-size: 0.85rem; line-height: 1.6; min-width: 200px; }
  .popup-content .stage { font-size: 1.1rem; font-weight: bold; margin-bottom: 4px; }
  .popup-content .plant-name { color: #555; margin-bottom: 6px; }
  .popup-content table { width: 100%; border-collapse: collapse; }
  .popup-content td { padding: 2px 4px; }
  .popup-content td:first-child { color: #888; white-space: nowrap; }
  .popup-content .comment { margin-top: 6px; color: #333; font-style: italic; }
  .legend {
    position: absolute;
    bottom: 30px;
    right: 10px;
    z-index: 1000;
    background: white;
    padding: 10px 14px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    font-size: 0.8rem;
  }
  .legend-item { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .legend-dot {
    width: 16px; height: 16px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.2);
    flex-shrink: 0;
  }
</style>
</head>
<body>
<div id="password-screen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#2d6a2d;display:flex;align-items:center;justify-content:center;z-index:9999;">
  <div style="background:white;padding:40px;border-radius:12px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,0.3);">
    <div style="font-size:2rem;margin-bottom:16px;">🌸</div>
    <h2 style="margin-bottom:8px;color:#2d6a2d;">秋まき植物育成試験</h2>
    <p style="color:#666;margin-bottom:24px;font-size:0.9rem;">観察マップ</p>
    <input id="pw-input" type="password" placeholder="パスワードを入力" style="width:200px;padding:10px;border:2px solid #ddd;border-radius:6px;font-size:1rem;text-align:center;margin-bottom:12px;display:block;margin-left:auto;margin-right:auto;">
    <button onclick="checkPassword()" style="background:#2d6a2d;color:white;border:none;padding:10px 30px;border-radius:6px;font-size:1rem;cursor:pointer;">入る</button>
    <p id="pw-error" style="color:red;margin-top:12px;font-size:0.85rem;display:none;">パスワードが違います</p>
  </div>
</div>
<div id="main-content" style="display:none;">
<div id="header">
  <h1>🌸 秋まき植物育成試験 観察マップ</h1>
  <span class="updated">更新: 2026/09/06 12:51</span>
</div>
<div id="map"></div>
<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#dcdcdc;"></div>ノースポール</div>
  <div class="legend-item"><div class="legend-dot" style="background:#7b2d8b;"></div>ムラサキハナナ</div>
  <div class="legend-item"><div class="legend-dot" style="background:#1a6bb5;"></div>その他</div>
</div>
<script>
const map = L.map('map').setView([36.5, 137.5], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/">OpenStreetMap</a> contributors',
  maxZoom: 18
}).addTo(map);

const markers = [{"lat":35.6,"lng":139.70277777777778,"plant":"キウイ","stage":"🍓結実（実がなった）","emoji":"🍓","color":"#1a6bb5","date":"2026/08/20","photo":"https://www.jotform.com/uploads/satorufujitani/262300671997059/6629715186145445040/17871622610302506877135453263696.jpg","height":"50 cm","temp":"28 ℃","weather":"曇","comment":"98円税抜","locationText":"東京都大田区北馬込1-13-3"},{"lat":37.1083333,"lng":138.2527778,"plant":"ソメイヨシノ","stage":"🌸開花（花がさいた）","emoji":"🌸","color":"#1a6bb5","date":"2026/04/05","photo":"https://www.jotform.com/uploads/satorufujitani/262300671997059/6629726476147728108/tmp_5f8cf2b2-efcb-4487-bb89-01cea5a63370.jpeg","height":"300 cm","temp":"23 ℃","weather":"曇","comment":"高田","locationText":"高田城址公園 新潟県上越市"}];

markers.forEach(m => {
  const icon = L.divIcon({
    className: '',
    html: `<div class="custom-marker" style="background:${m.color}">${m.emoji}</div>`,
    iconSize: [36, 36],
    iconAnchor: [18, 18],
    popupAnchor: [0, -20]
  });

//const photoHtml = m.photo
//  ? `<div style="margin-bottom:6px"><a href="${m.photo}" target="_blank" style="color:#2d6a2d;font-weight:bold;"> 写真を見る（別タブで開く）</a></div>`
//  : '';
  const photoHtml = '';

  const locationHtml = m.locationText
    ? `<tr><td>場所</td><td>${m.locationText}</td></tr>`
    : '';

  const commentHtml = m.comment
    ? `<div class="comment">💬 ${m.comment}</div>`
    : '';

  const popup = `
    <div class="popup-content">
      ${photoHtml}
      <div class="stage">${m.stage}</div>
      <div class="plant-name">${m.plant}</div>
      <table>
        <tr><td>観察日</td><td>${m.date}</td></tr>
        <tr><td>草丈</td><td>${m.height}</td></tr>
        <tr><td>気温</td><td>${m.temp}</td></tr>
        <tr><td>天候</td><td>${m.weather}</td></tr>
        ${locationHtml}
      </table>
      ${commentHtml}
    </div>
  `;

  L.marker([m.lat, m.lng], { icon }).addTo(map).bindPopup(popup, { maxWidth: 260 });
});
function checkPassword() {
  const input = document.getElementById('pw-input').value;
  if (input === 'akimaki2026') {
    document.getElementById('password-screen').style.display = 'none';
    const main = document.getElementById('main-content');
    main.style.display = 'block';
    setTimeout(function() { map.invalidateSize(); }, 100);
  } else {
    document.getElementById('pw-error').style.display = 'block';
  }
}
document.getElementById('pw-input').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') checkPassword();
});
</script>
</div>
</body>
</html>
