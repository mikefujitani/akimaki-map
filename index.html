<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>秋まき植物育成試験 観察マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Hiragino Sans', 'Meiryo', sans-serif; }
  #header {
    background: #2d6a2d;
    color: white;
    padding: 10px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #header h1 { font-size: 1rem; }
  #header .updated { font-size: 0.75rem; opacity: 0.8; }
  #map { height: calc(100vh - 44px); width: 100%; }
  .custom-marker {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px solid rgba(0,0,0,0.3);
    font-size: 18px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  .popup-photo {
    width: 100%;
    max-width: 220px;
    border-radius: 6px;
    margin-bottom: 6px;
    cursor: pointer;
  }
  .popup-content { font-size: 0.85rem; line-height: 1.6; min-width: 200px; }
  .popup-content .stage { font-size: 1.1rem; font-weight: bold; margin-bottom: 4px; }
  .popup-content .plant-name { color: #555; margin-bottom: 6px; }
  .popup-content table { width: 100%; border-collapse: collapse; }
  .popup-content td { padding: 2px 4px; }
  .popup-content td:first-child { color: #888; white-space: nowrap; }
  .popup-content .comment { margin-top: 6px; color: #333; font-style: italic; }
  .legend {
    position: absolute;
    bottom: 30px;
    right: 10px;
    z-index: 1000;
    background: white;
    padding: 10px 14px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    font-size: 0.8rem;
  }
  .legend-item { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .legend-dot {
    width: 16px; height: 16px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.2);
    flex-shrink: 0;
  }
</style>
</head>
<body>
<div id="header">
  <h1>🌸 秋まき植物育成試験 観察マップ</h1>
  <span class="updated">更新: 2026/08/20 03:26</span>
</div>
<div id="map"></div>
<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#dcdcdc;"></div>ノースポール</div>
  <div class="legend-item"><div class="legend-dot" style="background:#7b2d8b;"></div>ムラサキハナナ</div>
  <div class="legend-item"><div class="legend-dot" style="background:#1a6bb5;"></div>その他</div>
</div>
<script>
const map = L.map('map').setView([36.5, 137.5], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/">OpenStreetMap</a> contributors',
  maxZoom: 18
}).addTo(map);

const markers = [];

markers.forEach(m => {
  const icon = L.divIcon({
    className: '',
    html: `<div class="custom-marker" style="background:${m.color}">${m.emoji}</div>`,
    iconSize: [36, 36],
    iconAnchor: [18, 18],
    popupAnchor: [0, -20]
  });

  const photoHtml = m.photo
    ? `<img src="${m.photo}" class="popup-photo" onclick="window.open('${m.photo}','_blank')" title="クリックで拡大">`
    : '';

  const locationHtml = m.locationText
    ? `<tr><td>場所</td><td>${m.locationText}</td></tr>`
    : '';

  const commentHtml = m.comment
    ? `<div class="comment">💬 ${m.comment}</div>`
    : '';

  const popup = `
    <div class="popup-content">
      ${photoHtml}
      <div class="stage">${m.stage}</div>
      <div class="plant-name">${m.plant}</div>
      <table>
        <tr><td>観察日</td><td>${m.date}</td></tr>
        <tr><td>草丈</td><td>${m.height}</td></tr>
        <tr><td>気温</td><td>${m.temp}</td></tr>
        <tr><td>天候</td><td>${m.weather}</td></tr>
        ${locationHtml}
      </table>
      ${commentHtml}
    </div>
  `;

  L.marker([m.lat, m.lng], { icon }).addTo(map).bindPopup(popup, { maxWidth: 260 });
});
</script>
</body>
</html>
